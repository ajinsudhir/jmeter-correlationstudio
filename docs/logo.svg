<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5f8a"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#9fd3ff" stroke-width="2"/>

  <!-- Code bracket, left -->
  <path d="M 38 46 L 26 64 L 38 82" fill="none" stroke="#9fd3ff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Code bracket, right -->
  <path d="M 90 46 L 102 64 L 90 82" fill="none" stroke="#9fd3ff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Compass needle (the "pilot" element) -->
  <g transform="translate(64,64)">
    <circle r="22" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <!-- Needle: bright tip pointing up-right (forward progress), muted tail -->
    <path d="M 0 0 L 13 -13 L 4 -4 Z" fill="#ffb84d"/>
    <path d="M 0 0 L -13 13 L -4 4 Z" fill="#6fa8d6"/>
    <circle r="3.5" fill="#ffffff"/>
  </g>
</svg>
